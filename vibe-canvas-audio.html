<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe canvas — audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14151a;
    --panel: #1b1d24;
    --line: #2c2e37;
    --text: #e8e9ec;
    --text-dim: #8b8d99;
    --accent: #5fd6c9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .brand {
    position: fixed; top: 20px; left: 24px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    pointer-events: none; user-select: none;
  }
  .brand span {
    display: block; font-family: 'JetBrains Mono', monospace; font-weight: 400;
    font-size: 11px; letter-spacing: 0.02em; text-transform: none;
    color: var(--text-dim); margin-top: 4px;
  }
  .status {
    position: fixed; top: 20px; right: 24px;
    font-size: 11px; color: var(--text-dim);
    max-width: 260px; text-align: right;
    pointer-events: none; user-select: none;
  }
  .status.live { color: var(--accent); }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 16px 24px 20px;
    display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap;
  }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);
  }
  .fader { display: flex; flex-direction: column; gap: 8px; min-width: 110px; }
  .fader-label { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .fader-label b { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 2px;
    background: var(--line); border-radius: 2px; outline-offset: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer; margin-top: -5px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  .divider { width: 1px; align-self: stretch; background: var(--line); margin-bottom: 4px; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .swatch.active { border: 2px solid var(--text); }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
  .toggle-row input { accent-color: var(--accent); width: 14px; height: 14px; }
  .actions { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  button.action {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em;
    text-transform: uppercase; background: transparent; border: 1px solid var(--line);
    color: var(--text); padding: 9px 14px; border-radius: 4px; cursor: pointer;
    white-space: nowrap;
  }
  button.action:hover { border-color: var(--accent); color: var(--accent); }
  button.action.on { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); }
  #fileInput { display: none; }
  @media (max-width: 820px) {
    .panel { gap: 16px; padding: 14px 16px 18px; }
    .fader { min-width: 80px; }
    .actions { margin-left: 0; width: 100%; }
    .status { max-width: 180px; }
  }
</style>
</head>
<body>

<div class="brand">Vibe canvas
  <span>audio-reactive</span>
</div>
<div class="status" id="status">No audio source — pick one below</div>

<canvas id="canvas"></canvas>

<div class="panel">
  <div class="group">
    <div class="group-label">Source</div>
    <div class="actions" style="margin-left:0;">
      <button class="action" id="micBtn">Microphone</button>
      <button class="action" id="fileBtn">Load a song</button>
      <button class="action" id="playPauseBtn" style="display:none;">Pause</button>
      <input type="file" id="fileInput" accept="audio/*">
    </div>
  </div>

  <div class="divider"></div>

  <div class="fader">
    <div class="fader-label">Sensitivity <b id="sensVal">1.0</b></div>
    <input type="range" id="sensitivity" min="0.3" max="3" value="1" step="0.1">
  </div>
  <div class="fader">
    <div class="fader-label">Trail <b id="trailVal">70</b></div>
    <input type="range" id="trail" min="15" max="220" value="70" step="5">
  </div>

  <div class="divider"></div>

  <div class="group">
    <div class="group-label">Theme</div>
    <div class="swatches">
      <button class="swatch active" data-theme="aurora" style="background:#7F77DD" title="Aurora" aria-label="Aurora theme"></button>
      <button class="swatch" data-theme="sunset" style="background:#D85A30" title="Sunset" aria-label="Sunset theme"></button>
      <button class="swatch" data-theme="ocean" style="background:#378ADD" title="Ocean" aria-label="Ocean theme"></button>
      <button class="swatch" data-theme="mono" style="background:#888780" title="Mono" aria-label="Mono theme"></button>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Idle</div>
    <label class="toggle-row"><input type="checkbox" id="ambientToggle" checked> Ambient drift</label>
  </div>

  <div class="actions">
    <button class="action" id="clearBtn">Clear</button>
    <button class="action" id="saveBtn">Save PNG</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  let dpr = window.devicePixelRatio || 1;

  function resize(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  function setStatus(text, live){
    statusEl.textContent = text;
    statusEl.classList.toggle('live', !!live);
  }

  const themes = {
    aurora: ['#7F77DD','#5DCAA5','#ED93B1','#AFA9EC','#9FE1CB'],
    sunset: ['#F0997B','#FAC775','#ED93B1','#D85A30','#F5C4B3'],
    ocean:  ['#85B7EB','#5DCAA5','#378ADD','#9FE1CB','#B5D4F4'],
    mono:   ['#B4B2A9','#888780','#D3D1C7','#5F5E5A','#F1EFE8']
  };
  let currentTheme = 'aurora';
  document.querySelectorAll('.swatch[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTheme = btn.dataset.theme;
      document.querySelectorAll('.swatch[data-theme]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const state = { sensitivity: 1, trail: 70, ambient: true };
  const sensEl = document.getElementById('sensitivity');
  const trailEl = document.getElementById('trail');
  const ambientEl = document.getElementById('ambientToggle');
  sensEl.addEventListener('input', () => {
    state.sensitivity = parseFloat(sensEl.value);
    document.getElementById('sensVal').textContent = state.sensitivity.toFixed(1);
  });
  trailEl.addEventListener('input', () => {
    state.trail = parseInt(trailEl.value, 10);
    document.getElementById('trailVal').textContent = state.trail;
  });
  ambientEl.addEventListener('change', () => { state.ambient = ambientEl.checked; });

  let particles = [];
  function spawn(x, y, count, burst, sizeMult){
    const palette = themes[currentTheme];
    sizeMult = sizeMult || 1;
    for (let i=0;i<count;i++){
      const angle = burst ? Math.random()*Math.PI*2 : (Math.random()-0.5)*1.2;
      const speed = (burst ? 1.5 + Math.random()*3 : 0.3 + Math.random()*1.2);
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - (burst ? 0.4 : 0),
        life: 0,
        maxLife: state.trail + Math.random()*state.trail*0.6,
        size: (2 + Math.random()*4) * sizeMult,
        color: palette[Math.floor(Math.random()*palette.length)]
      });
    }
  }

  let lastX = null, lastY = null;
  canvas.addEventListener('mousemove', (e) => {
    const mouseX = e.clientX, mouseY = e.clientY;
    if (lastX !== null){
      const dist = Math.hypot(mouseX-lastX, mouseY-lastY);
      const steps = Math.max(1, Math.floor(dist/6));
      for (let s=0; s<steps; s++){
        const t = s/steps;
        spawn(lastX + (mouseX-lastX)*t, lastY + (mouseY-lastY)*t, 2, false);
      }
    }
    lastX = mouseX; lastY = mouseY;
  });
  canvas.addEventListener('mouseleave', () => { lastX = null; lastY = null; });
  canvas.addEventListener('click', (e) => { spawn(e.clientX, e.clientY, 26, true); });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (lastX !== null) spawn(t.clientX, t.clientY, 2, false);
    lastX = t.clientX; lastY = t.clientY;
    e.preventDefault();
  }, { passive: false });

  document.getElementById('clearBtn').addEventListener('click', () => { particles = []; });
  document.getElementById('saveBtn').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'vibe-canvas-audio.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });

  // --- audio ---
  let audioCtx, analyser, sourceNode, dataArray, bufferLength;
  let audioActive = false;
  let audioEl = null;

  function ensureContext(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function connectSource(node, toDestination){
    try { analyser.disconnect(); } catch(e){}
    node.connect(analyser);
    if (toDestination) analyser.connect(audioCtx.destination);
  }

  document.getElementById('micBtn').addEventListener('click', async () => {
    ensureContext();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} }
      sourceNode = audioCtx.createMediaStreamSource(stream);
      connectSource(sourceNode, false);
      audioActive = true;
      document.getElementById('playPauseBtn').style.display = 'none';
      setStatus('Listening to microphone', true);
    } catch(err) {
      setStatus('Microphone access denied or unavailable', false);
    }
  });

  const fileInput = document.getElementById('fileInput');
  document.getElementById('fileBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    ensureContext();
    if (audioEl) { audioEl.pause(); }
    audioEl = new Audio();
    audioEl.src = URL.createObjectURL(file);
    audioEl.loop = true;
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} }
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    connectSource(sourceNode, true);
    audioEl.play();
    audioActive = true;
    const playPauseBtn = document.getElementById('playPauseBtn');
    playPauseBtn.style.display = 'inline-block';
    playPauseBtn.textContent = 'Pause';
    setStatus('Playing: ' + file.name, true);
  });
  document.getElementById('playPauseBtn').addEventListener('click', () => {
    if (!audioEl) return;
    const btn = document.getElementById('playPauseBtn');
    if (audioEl.paused) { audioEl.play(); btn.textContent = 'Pause'; setStatus('Playing', true); }
    else { audioEl.pause(); btn.textContent = 'Play'; setStatus('Paused', false); }
  });

  function getAudioLevels(){
    if (!audioActive || !analyser) return { bass:0, mid:0, treble:0, overall:0 };
    analyser.getByteFrequencyData(dataArray);
    const n = bufferLength;
    const bassEnd = Math.max(1, Math.floor(n*0.12));
    const midEnd = Math.max(bassEnd+1, Math.floor(n*0.5));
    let bass=0, mid=0, treble=0;
    for (let i=0;i<bassEnd;i++) bass += dataArray[i];
    for (let i=bassEnd;i<midEnd;i++) mid += dataArray[i];
    for (let i=midEnd;i<n;i++) treble += dataArray[i];
    bass /= bassEnd;
    mid /= (midEnd-bassEnd);
    treble /= (n-midEnd);
    return { bass: bass/255, mid: mid/255, treble: treble/255, overall: (bass+mid+treble)/3/255 };
  }

  function drawBars(){
    if (!audioActive) return;
    const w = window.innerWidth, h = window.innerHeight;
    const midY = h/2;
    const barsCount = 48;
    const step = Math.max(1, Math.floor(bufferLength/barsCount));
    const barWidth = w/barsCount;
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = themes[currentTheme][0];
    for (let i=0;i<barsCount;i++){
      const v = dataArray[i*step] / 255;
      const barH = v*220;
      ctx.fillRect(i*barWidth, midY-barH/2, Math.max(1,barWidth-2), barH);
    }
    ctx.globalAlpha = 1;
  }

  let bassSmooth = 0;
  let kickCooldown = 0;

  function frame(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0,0,w,h);

    const levels = getAudioLevels();
    const sens = state.sensitivity;
    drawBars();

    if (audioActive){
      bassSmooth = bassSmooth*0.9 + levels.bass*0.1;
      if (kickCooldown > 0) kickCooldown--;
      if (levels.bass > 0.45 && levels.bass > bassSmooth + 0.14/Math.max(sens,0.3) && kickCooldown <= 0){
        spawn(w/2 + (Math.random()-0.5)*w*0.5, h/2, Math.round(14*sens), true, 1 + levels.bass);
        kickCooldown = 10;
      }
      if (Math.random() < levels.overall*0.25*sens){
        spawn(Math.random()*w, Math.random()*h, Math.max(1,Math.round(2*sens)), false, 1 + levels.treble*0.6);
      }
    } else if (state.ambient && Math.random() < 0.05){
      spawn(Math.random()*w, Math.random()*h, 1, false);
    }

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy *= 0.99;
      p.life++;
    });
    particles = particles.filter(p => p.life < p.maxLife);

    particles.forEach(p => {
      const alpha = 1 - p.life/p.maxLife;
      ctx.beginPath();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.arc(p.x, p.y, p.size*alpha + p.size*0.3, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
