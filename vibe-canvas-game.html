<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe canvas — chroma drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14151a;
    --panel: #1b1d24;
    --line: #2c2e37;
    --text: #e8e9ec;
    --text-dim: #8b8d99;
    --accent: #5fd6c9;
    --danger: #e2534a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden; user-select: none;
  }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }
  .brand {
    position: fixed; top: 20px; left: 24px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    pointer-events: none;
  }
  .brand span {
    display: block; font-family: 'JetBrains Mono', monospace; font-weight: 400;
    font-size: 11px; letter-spacing: 0.02em; text-transform: none;
    color: var(--text-dim); margin-top: 4px;
  }
  .hud {
    position: fixed; top: 20px; right: 24px; text-align: right;
    pointer-events: none; display: none;
  }
  .hud.show { display: block; }
  .hud .score { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: var(--text); }
  .hud .combo { font-size: 11px; color: var(--accent); margin-top: 2px; }
  .lives { position: fixed; top: 24px; left: 24px; display: none; gap: 6px; margin-top: 34px; }
  .lives.show { display: flex; }
  .life-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); margin-top: 30px; }
  .life-dot.lost { background: var(--line); }
  .target {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  .target.show { display: flex; }
  .target-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .target-swatch { width: 20px; height: 20px; border-radius: 50%; }
  .target-bar { width: 60px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .target-bar-fill { height: 100%; background: var(--accent); width: 100%; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(20,21,26,0.72);
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 36px 40px; max-width: 380px; width: 90%; text-align: center;
  }
  .card h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px;
    letter-spacing: 0.02em; margin: 0 0 6px;
  }
  .card p { font-size: 12px; line-height: 1.6; color: var(--text-dim); margin: 0 0 20px; }
  .swatches { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .swatch.active { border: 2px solid var(--text); }
  button.primary {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; background: transparent; border: 1px solid var(--accent);
    color: var(--accent); padding: 11px 22px; border-radius: 4px; cursor: pointer;
  }
  button.primary:hover { background: rgba(95,214,201,0.1); }
  .result-score { font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; margin: 6px 0 2px; }
  .result-best { font-size: 11px; color: var(--text-dim); margin-bottom: 22px; }
  button:focus-visible { outline: 2px solid var(--accent); }
  @media (max-width: 480px) {
    .card { padding: 28px 22px; }
  }
</style>
</head>
<body>

<div class="brand">Vibe canvas
  <span>chroma drift</span>
</div>
<div class="hud" id="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="combo" id="comboEl">&nbsp;</div>
</div>
<div class="lives" id="lives">
  <div class="life-dot" id="life0"></div>
  <div class="life-dot" id="life1"></div>
  <div class="life-dot" id="life2"></div>
</div>
<div class="target" id="targetHud">
  <div class="target-label">Catch this color</div>
  <div class="target-swatch" id="targetSwatch"></div>
  <div class="target-bar"><div class="target-bar-fill" id="targetBarFill"></div></div>
</div>

<canvas id="canvas"></canvas>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h1>Chroma drift</h1>
    <p>Move your mouse (or drag on touch) to steer the orb. Catch drifting particles that match the highlighted color. Wrong colors and the dark hazard orbs cost a life. The target color rotates — stay sharp.</p>
    <div class="swatches" id="startSwatches">
      <button class="swatch active" data-theme="aurora" style="background:#7F77DD" aria-label="Aurora theme"></button>
      <button class="swatch" data-theme="sunset" style="background:#D85A30" aria-label="Sunset theme"></button>
      <button class="swatch" data-theme="ocean" style="background:#378ADD" aria-label="Ocean theme"></button>
      <button class="swatch" data-theme="mono" style="background:#888780" aria-label="Mono theme"></button>
    </div>
    <button class="primary" id="startBtn">Start</button>
  </div>
</div>

<div class="overlay" id="overOverlay" style="display:none;">
  <div class="card">
    <h1>Run over</h1>
    <div class="result-score" id="finalScore">0</div>
    <div class="result-best" id="bestScore">Best: 0</div>
    <button class="primary" id="retryBtn">Play again</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let dpr = window.devicePixelRatio || 1;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const themes = {
    aurora: ['#7F77DD','#5DCAA5','#ED93B1','#AFA9EC','#9FE1CB'],
    sunset: ['#F0997B','#FAC775','#ED93B1','#D85A30','#F5C4B3'],
    ocean:  ['#85B7EB','#5DCAA5','#378ADD','#9FE1CB','#B5D4F4'],
    mono:   ['#B4B2A9','#888780','#D3D1C7','#5F5E5A','#F1EFE8']
  };
  let currentTheme = 'aurora';
  document.querySelectorAll('#startSwatches .swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTheme = btn.dataset.theme;
      document.querySelectorAll('#startSwatches .swatch').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const HAZARD_COLOR = '#4a4c56';

  let state = 'start'; // start | playing | gameover
  let pointer = { x: window.innerWidth/2, y: window.innerHeight/2 };
  let player = { x: window.innerWidth/2, y: window.innerHeight/2, r: 13 };
  let orbs = [];
  let bursts = [];
  let score = 0, combo = 0, lives = 3;
  let targetIdx = 0;
  let targetTimer = 0;
  const TARGET_ROTATE_MS = 8000;
  let elapsed = 0;
  let spawnAcc = 0;

  function setPointer(x,y){ pointer.x = x; pointer.y = y; }
  window.addEventListener('mousemove', (e) => setPointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    setPointer(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  function burst(x, y, color, count){
    for (let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 1 + Math.random()*3;
      bursts.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 0,
        maxLife: 26 + Math.random()*20,
        size: 2 + Math.random()*3,
        color
      });
    }
  }

  function updateHud(){
    document.getElementById('scoreEl').textContent = score;
    const mult = 1 + Math.floor(combo/5);
    document.getElementById('comboEl').textContent = combo > 0 ? ('combo x' + mult) : '\u00a0';
    for (let i=0;i<3;i++){
      document.getElementById('life'+i).classList.toggle('lost', i >= lives);
    }
    const palette = themes[currentTheme];
    document.getElementById('targetSwatch').style.background = palette[targetIdx];
    const pct = Math.max(0, 100 - (targetTimer/TARGET_ROTATE_MS)*100);
    document.getElementById('targetBarFill').style.width = pct + '%';
  }

  function pickNewTarget(){
    let next = Math.floor(Math.random()*themes[currentTheme].length);
    if (next === targetIdx) next = (next+1) % themes[currentTheme].length;
    targetIdx = next;
    targetTimer = 0;
  }

  function spawnOrb(){
    const w = window.innerWidth;
    const hazardChance = Math.min(0.22, 0.08 + elapsed/60000*0.1);
    const isHazard = Math.random() < hazardChance;
    const palette = themes[currentTheme];
    const colorIdx = isHazard ? -1 : Math.floor(Math.random()*palette.length);
    const speedBase = 1.1 + Math.min(2.2, elapsed/40000);
    orbs.push({
      x: 20 + Math.random()*(w-40),
      y: -30,
      vy: speedBase + Math.random()*0.8,
      wobbleAmp: 0.4 + Math.random()*0.6,
      wobbleFreq: 0.02 + Math.random()*0.02,
      wobblePhase: Math.random()*Math.PI*2,
      r: isHazard ? 12 : 10,
      hazard: isHazard,
      colorIdx,
      age: 0
    });
  }

  function loseLife(){
    lives--;
    combo = 0;
    if (lives <= 0){ gameOver(); }
  }

  function startGame(){
    score = 0; combo = 0; lives = 3; orbs = []; bursts = [];
    elapsed = 0; spawnAcc = 0; targetTimer = 0;
    targetIdx = Math.floor(Math.random()*themes[currentTheme].length);
    player.x = pointer.x; player.y = pointer.y;
    state = 'playing';
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('overOverlay').style.display = 'none';
    document.getElementById('hud').classList.add('show');
    document.getElementById('lives').classList.add('show');
    document.getElementById('targetHud').classList.add('show');
    updateHud();
  }

  function gameOver(){
    state = 'gameover';
    document.getElementById('hud').classList.remove('show');
    document.getElementById('lives').classList.remove('show');
    document.getElementById('targetHud').classList.remove('show');
    let best = parseInt(localStorage.getItem('vibeCanvasChromaDriftBest') || '0', 10);
    if (score > best){ best = score; localStorage.setItem('vibeCanvasChromaDriftBest', String(best)); }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = 'Best: ' + best;
    document.getElementById('overOverlay').style.display = 'flex';
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && state !== 'playing'){
      startGame();
    }
  });

  let lastTime = performance.now();
  function frame(now){
    const dt = Math.min(48, now - lastTime);
    lastTime = now;
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0,0,w,h);

    const palette = themes[currentTheme];

    if (state === 'playing'){
      elapsed += dt;
      targetTimer += dt;
      if (targetTimer >= TARGET_ROTATE_MS) pickNewTarget();

      player.x += (pointer.x - player.x) * 0.22;
      player.y += (pointer.y - player.y) * 0.22;

      const spawnInterval = Math.max(260, 950 - elapsed/1000*14);
      spawnAcc += dt;
      if (spawnAcc > spawnInterval){ spawnAcc = 0; spawnOrb(); }

      orbs.forEach(o => {
        o.age += dt;
        o.y += o.vy * (dt/16);
        o.x += Math.sin(o.age*o.wobbleFreq + o.wobblePhase) * o.wobbleAmp;
      });

      for (let i=orbs.length-1; i>=0; i--){
        const o = orbs[i];
        const dist = Math.hypot(o.x-player.x, o.y-player.y);
        if (dist < o.r + player.r){
          if (o.hazard){
            burst(o.x, o.y, HAZARD_COLOR, 14);
            loseLife();
          } else if (o.colorIdx === targetIdx){
            score += 10 * (1 + Math.floor(combo/5));
            combo++;
            burst(o.x, o.y, palette[o.colorIdx], 12);
          } else {
            burst(o.x, o.y, palette[o.colorIdx], 10);
            loseLife();
          }
          orbs.splice(i,1);
          continue;
        }
        if (o.y > h + 40) orbs.splice(i,1);
      }
      updateHud();
    }

    orbs.forEach(o => {
      ctx.beginPath();
      ctx.fillStyle = o.hazard ? HAZARD_COLOR : palette[o.colorIdx];
      ctx.globalAlpha = o.hazard ? 0.9 : 0.95;
      ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
      ctx.fill();
      if (o.hazard){
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#0f1013';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    bursts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life++; });
    bursts = bursts.filter(p => p.life < p.maxLife);
    bursts.forEach(p => {
      const a = 1 - p.life/p.maxLife;
      ctx.beginPath();
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.arc(p.x, p.y, p.size*a + p.size*0.3, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (state === 'playing'){
      ctx.beginPath();
      ctx.fillStyle = palette[targetIdx];
      ctx.globalAlpha = 0.95;
      ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
